name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Changes only to these paths do not change the site, so they do not trigger a deploy.
    # A push that also touches anything else still deploys. Manual runs: workflow_dispatch.
    paths-ignore:
      - 'CLAUDE.md'
      - 'tools/**'
      - 'jono.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
